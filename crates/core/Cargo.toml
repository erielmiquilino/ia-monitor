[package]
name = "ia-monitor-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "backfill"
path = "src/bin/backfill.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    # As duas origens de raiz de confiança. Só as embutidas quebrariam em
    # máquina com inspeção de TLS; só as do sistema quebrariam onde o
    # repositório do Windows estiver incompleto. Ver `http_client`.
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
zeroize = "1"
urlencoding = "2"
